<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: rounded industrial panel -->
  <rect width="64" height="64" rx="12" fill="#0f141c"/>

  <!-- Three converging log streams (Windows / SQL / SCADA) merging into one line -->
  <path d="M8 16 L26 16 L40 32" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M8 32 L26 32 L40 32" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M8 48 L26 48 L40 32" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Source nodes -->
  <circle cx="8" cy="16" r="3" fill="#22d3ee"/>
  <circle cx="8" cy="32" r="3" fill="#22d3ee"/>
  <circle cx="8" cy="48" r="3" fill="#22d3ee"/>

  <!-- Convergence / analysis node (the "aggregator") -->
  <circle cx="40" cy="32" r="5" fill="#f59e0b"/>

  <!-- Unified timeline output, ending in an alert marker (the anomaly) -->
  <path d="M40 32 L52 32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M52 32 L52 18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M48 22 L52 18 L56 22" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Timeline tick marks below, representing chronological ordering -->
  <line x1="14" y1="56" x2="50" y2="56" stroke="#232c3a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="20" cy="56" r="1.8" fill="#22d3ee"/>
  <circle cx="30" cy="56" r="1.8" fill="#22d3ee"/>
  <circle cx="40" cy="56" r="1.8" fill="#f59e0b"/>
</svg>
