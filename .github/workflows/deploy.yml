name: Deploy to Render

# Trigger on every push to main. Adjust to `pull_request` + `main` if you
# want CI checks on PRs without deploying.
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Verify, and Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: false

      - name: Build application
        run: bun run build
        env:
          # A dummy key is sufficient at build time since the SDK client
          # is only instantiated at request time inside the API route,
          # not during the Next.js build/prerender step.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'build-placeholder' }}

      - name: Trigger Render Deploy Hook
        # This step fires only after checkout, install, lint, and build all
        # succeed — Render will not receive a deploy signal for a broken build.
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK secret is not set." >&2
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Deployment triggered
        run: echo "Render deploy hook called successfully. Check the Render dashboard for build/deploy progress."
